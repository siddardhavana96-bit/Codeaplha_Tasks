name: quality-and-release
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew --no-daemon clean test jacocoTestReport build
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: build/reports/jacoco/test/html }
  publish-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { push: true, tags: '${{ secrets.DOCKERHUB_USERNAME }}/release-radar:${{ github.sha }}' }
