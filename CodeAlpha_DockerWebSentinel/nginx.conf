pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok","service":"web-sentinel"}'; }
    location = /metrics { stub_status; access_log off; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }
    location / { try_files $uri $uri/ =404; }
  }
}
