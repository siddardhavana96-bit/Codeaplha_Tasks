trigger:
  branches: { include: [main] }
variables:
  azureServiceConnection: azure-production
  acrServiceConnection: acr-production
  acrName: replacewithacr
  imageRepository: deliverypulse
  webAppName: replace-with-web-app
  resourceGroup: replace-with-resource-group
  tag: $(Build.SourceVersion)
stages:
- stage: Validate
  jobs:
  - job: TestAndScan
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: UsePythonVersion@0
      inputs: { versionSpec: '3.12' }
    - script: |
        pip install -r requirements-dev.txt
        python -m compileall src
        python -m unittest discover -s tests -v
        docker run --rm -v $(System.DefaultWorkingDirectory):/src aquasec/trivy:latest fs --exit-code 1 --severity HIGH,CRITICAL /src
      displayName: Test and scan source
- stage: Publish
  dependsOn: Validate
  jobs:
  - job: Containerize
    steps:
    - task: Docker@2
      inputs:
        command: build
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        Dockerfile: Dockerfile
        arguments: --build-arg APP_VERSION=$(tag)
        tags: |
          $(tag)
          latest
    - task: Docker@2
      inputs:
        command: push
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        tags: |
          $(tag)
          latest
- stage: Deploy
  dependsOn: Publish
  jobs:
  - deployment: AppService
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp config container set --resource-group $(resourceGroup) --name $(webAppName) --docker-custom-image-name $(acrName).azurecr.io/$(imageRepository):$(tag)
                az webapp restart --resource-group $(resourceGroup) --name $(webAppName)
                url=$(az webapp show -g $(resourceGroup) -n $(webAppName) --query defaultHostName -o tsv)
                for attempt in {1..12}; do curl --fail --silent "https://$url/healthz" && exit 0; sleep 10; done
                exit 1
